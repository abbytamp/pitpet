{% load static %}

<nav class="bg-white shadow-sm sticky top-0 z-50">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center">

    <!-- LOGO kiri -->
    <div class="flex items-center">
      <a href="{% url 'staff_dashboard' %}">
        <img src="{% static 'images/logo_pitpet.png' %}" alt="PITPET Logo" class="h-10 sm:h-12 w-auto">
      </a>
    </div>

    <!-- MENU kanan - Desktop -->
    <div class="hidden md:ml-auto md:flex items-center gap-6 lg:gap-8 font-semibold text-gray-700 text-base lg:text-lg">

      <!-- DROPDOWN DATA -->
      <div class="relative group">

        <button class="hover:text-[#F5A623] flex items-center gap-1 whitespace-nowrap">
          Data
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown menu -->
        <div class="absolute right-0 hidden group-hover:block bg-white shadow-md rounded-lg w-48 z-50">
          <a href="{% url 'staff_customer_list' %}" class="block px-4 py-2 hover:bg-gray-100">
            Data Customer
          </a>
          <a href="{% url 'groomer:groomer_list' %}" class="block px-4 py-2 hover:bg-gray-100">
            Data Groomer
          </a>
          <a href="{% url 'package_list' %}" class="block px-4 py-2 hover:bg-gray-100">
            Data Paket
          </a>
        </div>

      </div>

      <!-- RIWAYAT -->
      <a href="{% url 'booking:staff_booking_history_all' %}" class="hover:text-[#F5A623] whitespace-nowrap">
        Riwayat
      </a>


      <!-- JADWAL BOOKING -->
      <a href="{% url 'booking:staff_booking_schedule' %}" class="hover:text-[#F5A623] whitespace-nowrap">
        Jadwal Booking
      </a>

      <!-- PROFILE -->
      <a href="{% url 'profile' %}" class="hover:text-[#F5A623] whitespace-nowrap">
        Profile
      </a>

      <!-- LOGOUT -->
      <a href="{% url 'logout' %}"
        class="bg-[#F5A623] text-white px-4 sm:px-6 py-2 rounded-full hover:bg-orange-500 transition text-sm sm:text-base whitespace-nowrap">
        Log Out
      </a>

    </div>

    <!-- Mobile Menu Button -->
    <button id="staff-mobile-menu-btn" class="md:hidden ml-auto p-2 text-gray-700" onclick="toggleStaffMobileMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

  </div>

  <!-- Mobile Menu Dropdown -->
  <div id="staff-mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100">
    <div class="px-4 py-3 space-y-2">
      <!-- Data Dropdown for Mobile -->
      <div class="border-b border-gray-100 pb-2 mb-2">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Data</p>
        <a href="{% url 'staff_customer_list' %}" class="block py-2 text-gray-700 font-semibold hover:text-[#F5A623]">Data Customer</a>
        <a href="{% url 'groomer:groomer_list' %}" class="block py-2 text-gray-700 font-semibold hover:text-[#F5A623]">Data Groomer</a>
        <a href="{% url 'package_list' %}" class="block py-2 text-gray-700 font-semibold hover:text-[#F5A623]">Data Paket</a>
      </div>
      <a href="{% url 'booking:staff_booking_history_all' %}" class="block py-2 text-gray-700 font-semibold hover:text-[#F5A623]">Riwayat</a>
      <a href="{% url 'booking:staff_booking_schedule' %}" class="block py-2 text-gray-700 font-semibold hover:text-[#F5A623]">Jadwal Booking</a>
      <a href="{% url 'profile' %}" class="block py-2 text-gray-700 font-semibold hover:text-[#F5A623]">Profile</a>
      <a href="{% url 'logout' %}" class="block py-2 text-[#F5A623] font-semibold">Log Out</a>
    </div>
  </div>

</nav>

<script>
  function toggleStaffMobileMenu() {
    const menu = document.getElementById('staff-mobile-menu');
    menu.classList.toggle('hidden');
  }
</script>
