{% load static %}

<nav class="bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <!-- LOGO kiri -->
    <div class="flex items-center">
      <a href="{% url 'manager_dashboard' %}">
        <img src="{% static 'images/logo_pitpet.png' %}" alt="PITPET Logo" class="h-12 w-auto">
      </a>
    </div>

    <!-- Hamburger button (mobile) -->
    <button id="navbar-manager-toggle" class="ml-auto md:hidden flex items-center px-3 py-2 border rounded text-gray-700 border-gray-300 focus:outline-none" aria-label="Menu">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- MENU kanan -->
    <div id="navbar-manager-menu" class="hidden md:flex flex-col md:flex-row items-start md:items-center gap-6 md:gap-8 font-semibold text-gray-700 text-lg absolute md:static top-full left-0 w-full md:w-auto bg-white md:bg-transparent shadow md:shadow-none z-40 md:z-auto mt-2 md:mt-0 px-6 md:px-0 py-4 md:py-0">
      <a href="{% url 'manager_dashboard' %}" class="hover:text-[#F5A623] w-full md:w-auto py-2 md:py-0">Home</a>
      <a href="{% url 'profile' %}" class="hover:text-[#F5A623] w-full md:w-auto py-2 md:py-0">Profile</a>
      <!-- LOGOUT BUTTON -->
      <a href="{% url 'logout' %}" class="bg-[#F5A623] text-white px-6 py-2 rounded-full hover:bg-orange-500 transition w-full md:w-auto text-center">Log Out</a>
    </div>
  </div>
  <script>
    // Toggle menu on mobile
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('navbar-manager-toggle');
      const menu = document.getElementById('navbar-manager-menu');
      if (btn && menu) {
        btn.addEventListener('click', function() {
          menu.classList.toggle('hidden');
        });
      }
    });
  </script>
</nav>
