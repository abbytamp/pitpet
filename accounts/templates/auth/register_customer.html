{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up - PITPET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen w-screen">

    <div class="flex flex-col md:flex-row min-h-screen w-full">

        <!-- LEFT SIDE (IMAGE) -->
        <div class="w-full md:w-1/2 bg-white relative min-h-[300px] md:min-h-screen">

            <img src="{% static 'images/cat.png' %}"
                 class="absolute bottom-0 left-0 h-[250px] md:h-[90%] object-contain"
                 alt="Cat">

        </div>


        <!-- RIGHT SIDE (FORM) -->
        <div class="w-full md:w-1/2 flex flex-col justify-center px-8 md:px-24 bg-gray-100 py-10 md:py-0">

            {% include 'messages.html' %}

            <h2 class="text-3xl md:text-4xl font-bold text-cyan-500 mb-8">
                Sign up
            </h2>


         <form method="POST" class="w-full max-w-md">
          {% csrf_token %}




                                  <input type="email"
                                      name="username"
                                      placeholder="Email / Username"
                                      required
                                      value="{{ form.username.value|default:'' }}"
                                      class="w-full mb-4 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">

          <input type="text"
              name="full_name"
              placeholder="Full Name"
              required
              value="{{ form.full_name.value|default:'' }}"
              class="w-full mb-4 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">

          <input type="password"
              name="password"
              placeholder="Password"
              required
              class="w-full mb-4 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">

            <input type="text"
                name="phone_number" pattern="08[0-9]{8,10}" title="Nomor telepon harus dimulai dengan 08 dan berisi 10-12 digit angka"
                placeholder="Phone Number"
                required
                value="{{ form.phone_number.value|default:'' }}"
                class="w-full mb-6 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">

                <button type="submit"
                        class="w-full bg-cyan-500 text-white py-3 rounded-xl hover:bg-cyan-600 transition duration-300">
                    Create account
                </button>
            </form>

            <p class="text-sm text-gray-500 mt-6">
                Already have an account?
                <a href="{% url 'login' %}"
                   class="text-orange-400 font-semibold hover:underline">
                    Login
                </a>
            </p>

        </div>

    </div>

</body>

</html>
