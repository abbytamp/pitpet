{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - PITPET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen w-screen">

    <div class="flex flex-col md:flex-row min-h-screen w-full">

        <!-- LEFT SIDE (FORM) -->
        <div class="w-full md:w-1/2 flex flex-col justify-center px-8 md:px-24 bg-gray-100 py-10 md:py-0">

            {% include 'messages.html' %}

            <h2 class="text-3xl md:text-4xl font-bold text-cyan-500 mb-3">
                Login
            </h2>

            <p class="text-gray-500 mb-8">
                Login to access your pitpet account
            </p>

            <form method="POST" class="w-full max-w-md">
                {% csrf_token %}

                <input type="email"
                       name="username"
                       placeholder="Email"
                       required
                       class="w-full mb-5 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required
                       class="w-full mb-6 px-5 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">

                <button type="submit"
                        class="w-full bg-cyan-500 text-white py-3 rounded-xl hover:bg-cyan-600 transition duration-300">
                    Login
                </button>
            </form>

            <p class="text-sm text-gray-500 mt-6">
                Don't have an account?
                <a href="{% url 'register_customer' %}"
                   class="text-orange-400 font-semibold hover:underline">
                    Sign up
                </a>
            </p>

        </div>

        <!-- RIGHT SIDE (IMAGE) -->
        <div class="w-full md:w-1/2 bg-white flex items-center justify-center min-h-[300px] md:min-h-screen">

            <img src="{% static 'images/dog.png' %}"
                 class="h-[250px] md:h-[75%] object-contain"
                 alt="Dog">

        </div>

    </div>

</body>

</html>
