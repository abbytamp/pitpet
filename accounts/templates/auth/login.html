{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - PITPET</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

<div class="bg-gray-100 rounded-3xl shadow-2xl w-[900px] h-[500px] flex overflow-hidden">

    <!-- LEFT -->
    <div class="w-1/2 flex flex-col justify-center px-12">

        <!-- LOGO -->
        <img src="{% static 'images/logo_pitpet.png' %}"
             class="h-10 w-fit mb-6">


        <h2 class="text-2xl font-bold text-cyan-500 mb-2">
            Login
        </h2>

        <p class="text-gray-500 mb-6 text-sm">
            Login to access your pitpet account
        </p>


        <form method="POST">

            {% csrf_token %}

            <input type="email"
                   name="email"
                   placeholder="Email"
                   class="w-full mb-4 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400">


            <input type="password"
                   name="password"
                   placeholder="Password"
                   class="w-full mb-6 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400">


            <button
                type="submit"
                class="w-full bg-cyan-500 text-white py-2 rounded-lg hover:bg-cyan-600 transition">

                Login

            </button>

        </form>


        <p class="text-sm text-gray-500 mt-4 text-center">

            Don't have an account?

            <a href="{% url 'register' %}"
               class="text-orange-400 font-semibold">

                Sign up

            </a>

        </p>

    </div>


    <!-- RIGHT IMAGE -->
    <div class="w-1/2 flex items-center justify-center">

        <img src="{% static 'images/dog.png' %}"
             class="h-[400px] object-contain">

    </div>

</div>

</body>
</html>
