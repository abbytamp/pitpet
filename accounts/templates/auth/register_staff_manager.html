{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass p-10 rounded-3xl shadow-2xl">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold gradient-text">
                Register New Staff/Manager
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Password default: password123
            </p>
        </div>
                <form class="mt-8 space-y-4" method="POST" action="{% url 'register_staff_manager' %}">
                        {% csrf_token %}
                        <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username (Email)</label>
                    <input name="username" type="email" required
                        class="appearance-none rounded-xl block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                        placeholder="staff@gmail.com"
                        value="{{ form.username.value|default:'' }}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input name="full_name" type="text" required
                        class="appearance-none rounded-xl block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                        placeholder="Full Name"
                        value="{{ form.full_name.value|default:'' }}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input name="phone_number" type="text" required
                        class="appearance-none rounded-xl block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                        placeholder="08123456789"
                        value="{{ form.phone_number.value|default:'' }}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                    <select name="role" required
                        class="appearance-none rounded-xl block w-full px-4 py-3 border border-gray-300 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-white">
                        <option value="staff" {% if form.role.value == 'staff' %}selected{% endif %}>Staff</option>
                        <option value="manager" {% if form.role.value == 'manager' %}selected{% endif %}>Manager</option>
                    </select>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full py-3 px-4 
               text-sm font-semibold 
               rounded-xl text-white 
               bg-[#2BBDBD] hover:bg-[#24a5a5] 
               focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#2BBDBD]
               transition-all duration-200 
               shadow-lg hover:shadow-xl">
                    Register User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
